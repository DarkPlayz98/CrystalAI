<head>

<style>  
    body { background-color: #ffffff; color: #1e293b; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; height: 100dvh; overflow: hidden; }  
    ::-webkit-scrollbar { display: none; }  
    * { scrollbar-width: none; -ms-overflow-style: none; }  

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }  
    @keyframes spin { to { transform: rotate(360deg); } }  

    #login-screen { display: none; background-color: #000000; z-index: 100; }  
      
    .grok-input { background: transparent; border: 1px solid #333; color: white; transition: border-color 0.2s; }  
    .grok-input:focus { border-color: #fff; outline: none; }  

    .btn-loading .spinner { display: inline-block; }  
    .btn-loading .btn-text { opacity: 0; }  
    .spinner { display: none; width: 20px; height: 20px; border: 2.5px solid #000; border-bottom-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; position: absolute; }  
    .spinner.white-spin { border: 2.5px solid #fff; border-bottom-color: transparent; }  

    #sidebar { transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 4px 0 15px rgba(0,0,0,0.05); }  
    .sidebar-open #sidebar { transform: translateX(0); }  
    .sidebar-open #sidebar-overlay { opacity: 1; pointer-events: auto; }  

    #chat-container { height: calc(100dvh - 140px); overflow-y: auto; padding: 16px; scroll-behavior: smooth; }  
    #empty-state { transition: opacity 0.4s ease; }  

    .message { display: flex; margin-bottom: 24px; animation: fadeIn 0.3s ease; width: 100%; }  
    .message.bot { flex-direction: row; }  
    .message.user { flex-direction: row-reverse; }  
      
    .avatar { width: 34px; height: 34px; flex-shrink: 0; margin-right: 12px; margin-left: 12px; }  
    .bubble { max-width: 85%; padding: 12px 18px; font-size: 15.5px; line-height: 1.6; word-wrap: break-word; }  
    .user .bubble { background: #f1f5f9; color: #0f172a; border-radius: 20px 20px 4px 20px; }  
    .bot .bubble { background: transparent; color: #1e293b; border-radius: 20px 20px 20px 4px; }  

    #input-wrapper { position: fixed; bottom: env(safe-area-inset-bottom, 16px); left: 16px; right: 16px; background: #ffffff; border: 1px solid #e2e8f0; border-radius: 30px; display: flex; align-items: flex-end; padding: 8px 6px 8px 12px; box-shadow: 0 -4px 20px rgba(0,0,0,0.03); z-index: 40; }  
    textarea { flex: 1; background: transparent; color: #0f172a; border: none; padding: 8px; font-size: 16px; resize: none; outline: none; max-height: 120px; }  
    .send-btn { background: #4f46e5; color: white; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; flex-shrink: 0; }  
    .send-btn:active { transform: scale(0.9); }  
    .send-btn:disabled { background: #e2e8f0; color: #94a3b8; }  
      
    .typing-indicator { display: flex; align-items: center; gap: 4px; padding: 8px 4px; }  
    .typing-indicator span { width: 6px; height: 6px; background-color: #6366f1; border-radius: 50%; animation: bounce 1.4s infinite ease-in-out both; }  
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }  
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }  
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }  
</style>

</head>  
<body class="relative">

    <p class="text-xs text-gray-500">

  <script>
const firebaseConfig = {
  apiKey: "AIzaSyB2yW0RWDLqLiV097LM4VM6SHolDfX39Sc",
  authDomain: "crystal-ai-c5ae2.firebaseapp.com",
  projectId: "crystal-ai-c5ae2",
  storageBucket: "crystal-ai-c5ae2.firebasestorage.app",
  messagingSenderId: "390279102837",
  appId: "1:390279102837:web:260915ff71e8597536533c",
  measurementId: "G-KXMM9D9HMV"
};

try { firebase.initializeApp(firebaseConfig); } catch(e) {}
const auth = firebase.auth ? firebase.auth() : null;
const db = firebase.firestore ? firebase.firestore() : null;

// Replace with your Render URL
const BACKEND_URL = "https://crystal-ai-php6.onrender.com";
let isProcessing = false;
let chatHistory = [];
let currentChatId = null; 

const RAW_LOGO_SVG = `<svg class="w-full h-full" viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M16 2L3 10L16 18L29 10L16 2Z" fill="url(#grad-top4)"/><path d="M3 10L16 30L16 18L3 10Z" fill="url(#grad-left4)"/><path d="M29 10L16 30L16 18L29 10Z" fill="url(#grad-right4)"/><defs><linearGradient id="grad-top4" x1="16" y1="2" x2="16" y2="18" gradientUnits="userSpaceOnUse"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#3b82f6"/></linearGradient><linearGradient id="grad-left4" x1="3" y1="10" x2="16" y2="30" gradientUnits="userSpaceOnUse"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient><linearGradient id="grad-right4" x1="29" y1="10" x2="16" y2="30" gradientUnits="userSpaceOnUse"><stop stop-color="#8b5cf6"/><stop offset="1" stop-color="#4c1d95"/></linearGradient></defs></svg>`;

function showError(msg) { const errDiv = document.getElementById('login-error'); errDiv.textContent = msg; errDiv.classList.remove('hidden'); }
function showEmailForm() { document.getElementById('auth-buttons').classList.add('hidden'); document.getElementById('email-form').style.display = 'flex'; }
function hideEmailForm() { document.getElementById('email-form').style.display = 'none'; document.getElementById('auth-buttons').classList.remove('hidden'); document.getElementById('login-error').classList.add('hidden'); }
function toggleSidebar() { document.body.classList.toggle('sidebar-open'); }

window.toggleAttachmentMenu = function(e) {
    if(e) e.preventDefault();
    const menu = document.getElementById('attachment-menu');
    menu.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
    setTimeout(() => {
        menu.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
    }, 2500);
};

function startNewChat() { 
    document.body.classList.remove('sidebar-open'); 
    document.getElementById('chat-inner').innerHTML = ''; 
    document.getElementById('empty-state').style.display = 'flex'; 
    setTimeout(() => document.getElementById('empty-state').style.opacity = '1', 50); 
    isProcessing = false; 
    document.getElementById('sendBtn').disabled = false;
    chatHistory = []; 
    currentChatId = null;
}

function hideEmptyState() { const emptyState = document.getElementById('empty-state'); if(emptyState && emptyState.style.opacity !== '0') { emptyState.style.opacity = '0'; setTimeout(() => emptyState.style.display = 'none', 400); } }

async function loadSidebar() {
    if (!auth.currentUser || !db) return;
    const sidebarList = document.getElementById('sidebar-list');
    
    db.collection('users').doc(auth.currentUser.uid).collection('chats')
      .orderBy('updatedAt', 'desc').limit(15)
      .get().then((snapshot) => {
          if (snapshot.empty) {
              sidebarList.innerHTML = '<p class="text-sm text-slate-400 text-center mt-4">No recent chats</p>';
              return;
          }
          sidebarList.innerHTML = '';
          snapshot.forEach(doc => {
              const data = doc.data();
              const btn = document.createElement('button');
              btn.className = "w-full text-left p-3 hover:bg-slate-100 rounded-xl mb-1 text-sm font-medium text-slate-700 truncate shadow-sm border border-slate-100";
              btn.textContent = data.title || "New Chat";
              btn.onclick = () => loadChat(doc.id, data.messages);
              sidebarList.appendChild(btn);
          });
      });
}

function loadChat(chatId, messages) {
    currentChatId = chatId;
    chatHistory = messages;
    document.getElementById('chat-inner').innerHTML = '';
    document.getElementById('empty-state').style.display = 'none';
    
    messages.forEach(msg => {
        window.addBubble(msg.content, msg.role === 'user' ? 'user' : 'bot');
    });
    toggleSidebar();
}

if(auth) {
    auth.onAuthStateChanged((user) => {
        const loginScreen = document.getElementById('login-screen');
        if (user) {
            loginScreen.style.display = 'none';
            document.body.style.backgroundColor = '#ffffff';
            const emailText = user.email || "User";
            document.getElementById('user-email').textContent = emailText;
            document.getElementById('user-initial').textContent = emailText.charAt(0).toUpperCase();
            loadSidebar(); 
        } else {
            loginScreen.style.display = 'flex';
            document.querySelectorAll('.btn-loading').forEach(b => b.classList.remove('btn-loading')); 
            hideEmailForm();
        }
    });
}
     async function signInWithGoogle(btn) { 
    if(!auth) return; 
    btn.classList.add('btn-loading'); 
    try {
        // 1. Trigger the Native Android Google login dialog
        const googleUser = await window.Capacitor.Plugins.GoogleAuth.signIn();
        
        // 2. Hand the native token over to Firebase
        const credential = firebase.auth.GoogleAuthProvider.credential(googleUser.authentication.idToken);
        await auth.signInWithCredential(credential);
        
        console.log("Native Google Sign-In Successful!");
    } catch (error) {
        console.error("Google Sign-in failed:", error);
        showError("Sign-in cancelled or failed.");
        btn.classList.remove('btn-loading');
    }
}
function loginEmail(btn) { const email = document.getElementById('email-input').value.trim(); const password = document.getElementById('password-input').value.trim(); if(!email || !password) return showError("Please enter email and password."); btn.classList.add('btn-loading'); auth.signInWithEmailAndPassword(email, password).catch((error) => { btn.classList.remove('btn-loading'); showError(error.message); }); }
function signupEmail(btn) { const email = document.getElementById('email-input').value.trim(); const password = document.getElementById('password-input').value.trim(); if(!email || !password) return showError("Please enter email and password."); btn.classList.add('btn-loading'); auth.createUserWithEmailAndPassword(email, password).catch((error) => { btn.classList.remove('btn-loading'); showError(error.message); }); }
function signOutUser() { if(auth) auth.signOut(); document.body.classList.remove('sidebar-open'); chatHistory = []; document.getElementById('sidebar-list').innerHTML = ''; }

window.parseMarkdown = function(text) {
    if (!text || typeof text !== "string") return "Error reading response.";
    let cleanedText = text.replace(/<think>[\s\S]*?(?:<\/think>|$)/gi, '').trim();
    if (!cleanedText) return "Processing...";
    let html = cleanedText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const codeBlockRegex = /\x60\x60\x60([a-zA-Z0-9-]*)\n?([\s\S]*?)(?:\x60\x60\x60|$)/g;
    html = html.replace(codeBlockRegex, (match, language, snippet) => {
        const langLabel = language ? language.toUpperCase() : "CODE";
        return `<div class="mt-4 mb-4 rounded-xl overflow-hidden border border-slate-200"><div class="bg-slate-100 text-slate-500 text-xs py-2 px-3 flex justify-between items-center font-semibold"><span class="font-mono tracking-wider">${langLabel}</span><button class="text-indigo-600 hover:text-indigo-800" onclick="window.copyToClipboard(this)">Copy</button></div><pre class="bg-slate-800 p-4 overflow-x-auto text-sm text-slate-50 font-mono" style="white-space: pre-wrap; word-break: break-word;"><code>${snippet.trim()}</code></pre></div>`;
    });
    html = html.replace(/\x60([^\x60\n]+)\x60/g, '<code style="background:#f1f5f9; border: 1px solid #e2e8f0; padding:2px 6px; border-radius:6px; color:#4f46e5; font-family:monospace; font-size:0.9em;">$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong class="text-slate-900">$1</strong>');
    html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    html = html.replace(/^\s*[-*] (.*$)/gim, '<li class="ml-4 list-disc mb-1">$1</li>');
    html = html.replace(/(<li.*?>.*?<\/li>\n?)+/g, '<ul class="mb-4">$&</ul>');
    let blocks = html.split('\n\n');
    for (let i = 0; i < blocks.length; i++) {
        if (!blocks[i].startsWith('<div') && !blocks[i].startsWith('<ul')) blocks[i] = `<p class="mb-3">${blocks[i].replace(/\n/g, '<br>')}</p>`;
    }
    return blocks.join('');
};

window.copyToClipboard = function(btn) {
    const pre = btn.parentElement.nextElementSibling;
    navigator.clipboard.writeText(pre.innerText).then(() => {
        const old = btn.textContent; btn.textContent = "Copied!"; setTimeout(() => btn.textContent = old, 2000);
    });
};

window.addBubble = function(text, kind, isTyping = false) {
    hideEmptyState();
    const chatInner = document.getElementById('chat-inner');
    const chatArea = document.getElementById('chat-container');
    const wrapper = document.createElement('div');
    wrapper.className = `message ${kind}`;
    if (kind === "bot") { wrapper.innerHTML = `<div class="avatar">${RAW_LOGO_SVG}</div>`; }
    const bubble = document.createElement('div');
    bubble.className = "bubble";
    if (isTyping) { bubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`; } 
    else if (kind === "bot") { bubble.innerHTML = `<div class="main-content">${window.parseMarkdown(text)}</div>`; } 
    else { bubble.textContent = text; }
    wrapper.appendChild(bubble); chatInner.appendChild(wrapper);
    setTimeout(() => chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' }), 50);
    return bubble;
};

window.submitMessage = async function(e) {
    if(e) e.preventDefault();
    if(isProcessing) return;

    const input = document.getElementById('message');
    const sendBtn = document.getElementById('sendBtn');
    const text = input.value.trim();
    if(!text) return;

    isProcessing = true; input.value = ""; input.style.height = "auto"; sendBtn.disabled = true;
    window.addBubble(text, "user");
    const loadingBubble = window.addBubble("", "bot", true);

    chatHistory.push({ role: "user", content: text });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(chatHistory.length - 20);

    try {
        const response = await fetch(`${BACKEND_URL}/api/chat`, {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text, messages: chatHistory }) 
        });
        
        const responseText = await response.text(); 
        
        let data = {};
        try { data = JSON.parse(responseText); } catch { throw new Error("Backend returned invalid data. Check Render logs."); }
        
        if (!response.ok) {
            chatHistory.pop();
            throw new Error(data.reply || `Error ${response.status}`);
        }
        
        chatHistory.push({ role: "assistant", content: data.reply || "" });
        window.addBubble(data.reply || "I encountered an error generating a response.", "bot");
        loadingBubble.parentElement.remove(); 

        if(auth.currentUser && db) {
            if (!currentChatId) currentChatId = Date.now().toString();
            const chatTitle = chatHistory[0].content.substring(0, 30) + "...";
            
            db.collection('users').doc(auth.currentUser.uid).collection('chats').doc(currentChatId).set({
                title: chatTitle,
                messages: chatHistory,
                updatedAt: firebase.firestore.FieldValue.serverTimestamp()
            }).then(() => loadSidebar());
        }

    } catch (err) {
        console.error(err);
        loadingBubble.className = "bubble bg-red-50 text-red-600 border border-red-200 rounded-2xl p-3 text-sm max-w-[85%]";
        loadingBubble.innerHTML = `⚠️ Connection Error: ${err.message}`;
    } finally {
        isProcessing = false; sendBtn.disabled = false; input.focus();
    }
};

const input = document.getElementById('message');
input.addEventListener('input', function() { this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 100) + "px"; });
input.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.submitMessage(e); } });

if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('/sw.js');
}

// Brutally force the Android hardware status bar to pitch black
document.addEventListener('DOMContentLoaded', () => {
    setTimeout(async () => {
        if (window.Capacitor && window.Capacitor.Plugins.StatusBar) {
            try {
                await window.Capacitor.Plugins.StatusBar.setBackgroundColor({ color: '#000000' });
                await window.Capacitor.Plugins.StatusBar.setOverlaysWebView({ overlay: false });
            } catch (e) {
                console.log("Status bar sync failed", e);
            }
        }
    }, 500); // Slight delay ensures the native layer is fully awake
});
      
</script>
