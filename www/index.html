<!DOCTYPE html>  <html lang="en">  
<head>  
    <meta charset="UTF-8">  
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">  
    <meta name="theme-color" content="#ffffff" id="theme-color-meta">  
    <meta name="apple-mobile-web-app-capable" content="yes">  
    <title>Crystal AI</title>
    <link rel="manifest" href="/manifest.json">  <script src="https://cdn.tailwindcss.com"></script>  
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>  
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>  
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>  

<style>  
    :root { --bg-color: #ffffff; --text-color: #1e293b; --bubble-user: #f1f5f9; --bubble-bot: transparent; --border-color: #e2e8f0; --input-bg: #ffffff; --sidebar-bg: #ffffff; --sidebar-hover: #f1f5f9; }
    body.dark-mode { --bg-color: #0f172a; --text-color: #f8fafc; --bubble-user: #1e293b; --border-color: #334155; --input-bg: #1e293b; --sidebar-bg: #0f172a; --sidebar-hover: #1e293b; }
    
    body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; overscroll-behavior-y: none; height: 100dvh; overflow: hidden; transition: background-color 0.3s, color 0.3s; }  
    ::-webkit-scrollbar { display: none; } * { scrollbar-width: none; -ms-overflow-style: none; }  

    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }  
    @keyframes spin { to { transform: rotate(360deg); } }  

    #login-screen { display: none; background-color: #000000; z-index: 100; color: white; }  
    .grok-input { background: transparent; border: 1px solid #333; color: white; transition: border-color 0.2s; }  
    .grok-input:focus { border-color: #fff; outline: none; }  
    .btn-loading .spinner { display: inline-block; } .btn-loading .btn-text { opacity: 0; }  
    .spinner { display: none; width: 20px; height: 20px; border: 2.5px solid #000; border-bottom-color: transparent; border-radius: 50%; animation: spin 0.8s linear infinite; position: absolute; }  
    .spinner.white-spin { border: 2.5px solid #fff; border-bottom-color: transparent; }  

    #sidebar { background-color: var(--sidebar-bg); transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 4px 0 15px rgba(0,0,0,0.05); }  
    .sidebar-open #sidebar { transform: translateX(0); }  
    .sidebar-open #sidebar-overlay { opacity: 1; pointer-events: auto; }  
    .sidebar-btn { color: var(--text-color); border-color: var(--border-color); }
    .sidebar-btn:hover { background-color: var(--sidebar-hover); }

    #chat-container { height: calc(100dvh - 140px); overflow-y: auto; padding: 16px; scroll-behavior: smooth; }  
    .message { display: flex; margin-bottom: 24px; animation: fadeIn 0.3s ease; width: 100%; }  
    .message.bot { flex-direction: row; } .message.user { flex-direction: row-reverse; }  
    .avatar { width: 34px; height: 34px; flex-shrink: 0; margin-right: 12px; margin-left: 12px; }  
    .bubble { max-width: 85%; padding: 12px 18px; font-size: 15.5px; line-height: 1.6; word-wrap: break-word; }  
    .user .bubble { background: var(--bubble-user); color: var(--text-color); border-radius: 20px 20px 4px 20px; }  
    .bot .bubble { background: var(--bubble-bot); color: var(--text-color); border-radius: 20px 20px 20px 4px; }  

    #input-wrapper { position: fixed; bottom: env(safe-area-inset-bottom, 16px); left: 16px; right: 16px; background: var(--input-bg); border: 1px solid var(--border-color); border-radius: 30px; display: flex; flex-direction: column; padding: 8px 6px 8px 12px; box-shadow: 0 -4px 20px rgba(0,0,0,0.03); z-index: 40; transition: background-color 0.3s, border-color 0.3s; }  
    .quick-prompts { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 4px; border-bottom: 1px solid var(--border-color); white-space: nowrap; }
    .quick-chip { background: var(--bubble-user); color: var(--text-color); padding: 6px 12px; border-radius: 16px; font-size: 13px; font-weight: 500; cursor: pointer; border: 1px solid var(--border-color); }
    .input-row { display: flex; align-items: flex-end; width: 100%; }
    textarea { flex: 1; background: transparent; color: var(--text-color); border: none; padding: 8px; font-size: 16px; resize: none; outline: none; max-height: 120px; }  
    .icon-btn { color: #94a3b8; transition: color 0.2s, transform 0.2s; display: flex; items-center; justify-center; width: 38px; height: 38px; flex-shrink: 0; }
    .icon-btn:active { transform: scale(0.9); }
    .icon-btn.active { color: #ef4444; animation: pulse 1.5s infinite; }
    .send-btn { background: #4f46e5; color: white; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: transform 0.2s; flex-shrink: 0; }  
    .send-btn:active { transform: scale(0.9); } .send-btn:disabled { background: var(--border-color); }  
    
    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    .typing-indicator span { width: 6px; height: 6px; background-color: #6366f1; border-radius: 50%; display: inline-block; animation: bounce 1.4s infinite ease-in-out both; }  
    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; } .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }  
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); opacity: 0.3; } 40% { transform: scale(1); opacity: 1; } }  
    
    /* Code Block Styling */
    pre { background: #1e293b !important; color: #f8fafc !important; }
</style>
</head>  
<body class="relative">
    <div id="login-screen" class="fixed inset-0 flex-col items-center justify-center px-8">
        <div class="w-full max-w-sm">
            <h1 class="text-4xl font-extrabold tracking-tighter mb-2">Crystal AI</h1>

            <div id="auth-buttons" class="w-full flex flex-col gap-4">

    <div id="settings-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-[60] hidden flex-col items-center justify-center px-4 opacity-0 transition-opacity">
        <div class="w-full max-w-md bg-[var(--bg-color)] border border-[var(--border-color)] rounded-2xl p-6 shadow-2xl flex flex-col gap-4">
            <div class="flex justify-between items-center mb-2">
                <h2 class="text-xl font-bold">App Settings</h2>
                <button onclick="toggleSettings()" class="text-gray-500 hover:text-red-500"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
            </div>
            
            <div class="flex items-center justify-between p-3 border border-[var(--border-color)] rounded-xl">
                <span class="font-medium">Dark Mode</span>
                <button id="dark-toggle" onclick="toggleDarkMode()" class="w-12 h-6 bg-gray-300 rounded-full relative transition-colors duration-300">
                    <div id="dark-knob" class="w-5 h-5 bg-white rounded-full absolute top-0.5 left-0.5 transition-transform duration-300 shadow"></div>
                </button>
            </div>

            <div class="flex flex-col gap-2">
                <label class="font-medium text-sm">Custom AI Instructions</label>
                <textarea id="custom-instructions" rows="3" class="w-full bg-[var(--bubble-user)] border border-[var(--border-color)] text-[var(--text-color)] p-3 rounded-xl text-sm outline-none focus:border-indigo-500" placeholder="E.g., Always answer in a sarcastic tone..."></textarea>
            </div>
            <button onclick="saveSettings()" class="w-full py-3 bg-indigo-600 text-white rounded-xl font-bold mt-2">Save Settings</button>
        </div>
    </div>

    <div id="sidebar-overlay" class="fixed inset-0 bg-slate-900/20 backdrop-blur-sm opacity-0 pointer-events-none transition-opacity duration-300 z-40" onclick="toggleSidebar()"></div>
    
    <aside id="sidebar" class="fixed top-0 left-0 h-full w-72 z-50 transform -translate-x-full flex flex-col pt-[max(env(safe-area-inset-top,16px),16px)] border-r border-[var(--border-color)]">
        <div class="p-4 border-b border-[var(--border-color)] flex justify-between items-center">
            <div class="flex items-center gap-3 overflow-hidden">
                <div class="w-8 h-8 rounded-full bg-indigo-100 flex items-center justify-center text-indigo-600 font-bold" id="user-initial">U</div>
                <div class="text-sm font-medium truncate w-32" id="user-email">user@email.com</div>
            </div>
            <button onclick="toggleSettings()" class="text-slate-500 hover:text-indigo-500"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg></button>
        </div>
        
        <div class="p-4 border-b border-[var(--border-color)] bg-[var(--sidebar-hover)] flex items-center justify-between cursor-pointer" onclick="toggleCopilot()">
            <div>
                <div class="text-sm font-bold text-indigo-500">Game Dev Copilot</div>
                <div class="text-xs text-gray-500 mt-0.5">Luau & Roblox optimization</div>
            </div>
            <div id="copilot-dot" class="w-3 h-3 rounded-full bg-gray-300"></div>
        </div>
        
        <div id="sidebar-list" class="flex-1 overflow-y-auto p-4 flex flex-col gap-2"></div>
        
        <div class="p-4 border-t border-[var(--border-color)]">
            <button onclick="startNewChat()" class="w-full py-3 bg-[#0f172a] hover:bg-slate-800 text-white rounded-xl text-sm font-bold">New Chat</button>
            <button onclick="signOutUser()" class="w-full mt-2 py-2 text-xs font-semibold text-red-500">Logout</button>
        </div>
    </aside>
        <div class="flex flex-col h-full relative z-30">
        <header class="flex justify-between items-center p-4 pt-[max(env(safe-area-inset-top,16px),16px)] border-b border-[var(--border-color)]">
            <button onclick="toggleSidebar()" class="p-1"><svg width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"></path></svg></button>
            <span class="font-bold text-lg tracking-wide absolute left-1/2 transform -translate-x-1/2">Crystal<span class="text-indigo-500">.</span></span>
            <div class="w-8"></div>
        </header>

        <main id="chat-container" class="relative flex-1">
            <div id="empty-state" class="absolute inset-0 flex flex-col items-center justify-center pb-24 z-10 pointer-events-none">
                <h2 class="text-xl tracking-wide opacity-50">How can I help you today?</h2>
            </div>
            <div id="chat-inner" class="pb-36 relative z-20 flex flex-col"></div>
        </main>

        <div id="input-wrapper">
            <div class="quick-prompts">
                <button class="quick-chip" onclick="injectPrompt('Write a Luau script for an NPC roaming system')">NPC Roaming</button>
                <button class="quick-chip" onclick="injectPrompt('Generate procedural map logic in Luau')">Map Gen</button>
                <button class="quick-chip" onclick="injectPrompt('How do I optimize Roblox memory usage?')">Memory Fix</button>
                <button class="quick-chip" onclick="injectPrompt('Review this script and fix errors')">Review Code</button>
            </div>

            <input type="file" id="file-input" class="hidden" accept="image/*" onchange="window.handleFileUpload(event)">
            <div id="attachment-preview" class="hidden absolute bottom-[120%] left-2 p-2 bg-[var(--bg-color)] border border-[var(--border-color)] rounded-xl shadow-lg items-center gap-3">
                <img id="preview-img" class="w-14 h-14 object-cover rounded-lg">
                <button onclick="window.removeAttachment(event)" class="text-red-500 p-1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
            </div>

            <div class="input-row">
                <button onclick="window.triggerAttachment(event)" class="icon-btn mb-[2px] mr-1"><svg width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg></button>
                <textarea id="message" rows="1" placeholder="Ask Crystal..."></textarea>
                
                <button id="mic-btn" onclick="toggleVoiceRecording()" class="icon-btn mb-[2px] mx-1"><svg width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg></button>
                
                <button type="submit" id="sendBtn" class="send-btn mb-[2px]" onclick="window.submitMessage(event)">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16"><path d="M15.854.146a.5.5 0 0 1 .11.54l-5.819 14.547a.75.75 0 0 1-1.329.124l-3.178-4.995L.643 7.184a.75.75 0 0 1 .124-1.33L15.314.037a.5.5 0 0 1 .54.11ZM6.636 10.07l2.761 4.338L14.13 2.576 6.636 10.07Zm6.787-8.201L1.591 6.602l4.339 2.76 7.494-7.493Z"/></svg>
                </button>
            </div>
        </div>
        </div>
        <script>
const firebaseConfig = { apiKey: "AIzaSyB2yW0RWDLqLiV097LM4VM6SHolDfX39Sc", authDomain: "crystal-ai-c5ae2.firebaseapp.com", projectId: "crystal-ai-c5ae2", storageBucket: "crystal-ai-c5ae2.firebasestorage.app", messagingSenderId: "390279102837", appId: "1:390279102837:web:260915ff71e8597536533c", measurementId: "G-KXMM9D9HMV" };
try { firebase.initializeApp(firebaseConfig); } catch(e) {}
const auth = firebase.auth ? firebase.auth() : null;
const db = firebase.firestore ? firebase.firestore() : null;
const BACKEND_URL = "https://crystal-ai-php6.onrender.com";

let isProcessing = false; let chatHistory = []; let currentChatId = null; let currentAttachment = null;
let isDarkMode = false; let isCopilot = false; let sysInstructions = "";
let recognition = null; let isRecording = false;

// Hardware Vibrate Helper
const vibrate = async () => { if (window.Capacitor?.Plugins?.Haptics) { try { await window.Capacitor.Plugins.Haptics.impact({ style: 'LIGHT' }); } catch(e){} } };

// Voice Recognition Setup
if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    recognition = new SpeechRec();
    recognition.continuous = false; recognition.interimResults = true;
    recognition.onresult = (event) => { document.getElementById('message').value = event.results[0][0].transcript; document.getElementById('message').style.height = "auto"; document.getElementById('message').style.height = document.getElementById('message').scrollHeight + "px"; };
    recognition.onend = () => { isRecording = false; document.getElementById('mic-btn').classList.remove('active'); };
}

function toggleVoiceRecording() {
    if (!recognition) return alert("Voice input not supported on this browser engine.");
    if (isRecording) { recognition.stop(); } else { vibrate(); recognition.start(); isRecording = true; document.getElementById('mic-btn').classList.add('active'); }
}

function injectPrompt(text) { document.getElementById('message').value = text; vibrate(); }

// UI & Settings Logic
function toggleSidebar() { document.body.classList.toggle('sidebar-open'); vibrate(); }
function toggleSettings() { const m = document.getElementById('settings-modal'); if(m.classList.contains('hidden')) { m.classList.remove('hidden'); m.style.display = 'flex'; setTimeout(() => m.classList.remove('opacity-0'), 10); document.getElementById('custom-instructions').value = sysInstructions; } else { m.classList.add('opacity-0'); setTimeout(() => { m.classList.add('hidden'); m.style.display = 'none'; }, 300); } }

function toggleCopilot() {
    isCopilot = !isCopilot; vibrate();
    const dot = document.getElementById('copilot-dot');
    dot.className = isCopilot ? "w-3 h-3 rounded-full bg-indigo-500 shadow-[0_0_8px_rgba(99,102,241,0.8)]" : "w-3 h-3 rounded-full bg-gray-300";
}

function toggleDarkMode() {
    isDarkMode = !isDarkMode; vibrate();
    if(isDarkMode) {
        document.body.classList.add('dark-mode'); document.getElementById('theme-color-meta').content = "#0f172a";
        document.getElementById('dark-knob').style.transform = 'translateX(24px)'; document.getElementById('dark-toggle').classList.replace('bg-gray-300', 'bg-indigo-500');
        if(window.Capacitor?.Plugins?.StatusBar) { window.Capacitor.Plugins.StatusBar.setBackgroundColor({color: '#0f172a'}); window.Capacitor.Plugins.StatusBar.setStyle({style: 'DARK'}); }
    } else {
        document.body.classList.remove('dark-mode'); document.getElementById('theme-color-meta').content = "#ffffff";
        document.getElementById('dark-knob').style.transform = 'translateX(0)'; document.getElementById('dark-toggle').classList.replace('bg-indigo-500', 'bg-gray-300');
        if(window.Capacitor?.Plugins?.StatusBar) { window.Capacitor.Plugins.StatusBar.setBackgroundColor({color: '#ffffff'}); window.Capacitor.Plugins.StatusBar.setStyle({style: 'LIGHT'}); }
    }
}

function saveSettings() { sysInstructions = document.getElementById('custom-instructions').value; toggleSettings(); }

window.triggerAttachment = function(e) { if(e) e.preventDefault(); document.getElementById('file-input').click(); };
window.handleFileUpload = function(e) { const file = e.target.files[0]; if(!file) return; const reader = new FileReader(); reader.onload = function(evt) { currentAttachment = evt.target.result; document.getElementById('preview-img').src = currentAttachment; document.getElementById('attachment-preview').classList.remove('hidden'); document.getElementById('attachment-preview').classList.add('flex'); }; reader.readAsDataURL(file); };
window.removeAttachment = function(e) { if(e) e.preventDefault(); currentAttachment = null; document.getElementById('file-input').value = ''; document.getElementById('attachment-preview').classList.remove('flex'); document.getElementById('attachment-preview').classList.add('hidden'); };

function startNewChat() { document.body.classList.remove('sidebar-open'); document.getElementById('chat-inner').innerHTML = ''; document.getElementById('empty-state').style.display = 'flex'; setTimeout(() => document.getElementById('empty-state').style.opacity = '1', 50); isProcessing = false; document.getElementById('sendBtn').disabled = false; chatHistory = []; currentChatId = null; }
function hideEmptyState() { const emptyState = document.getElementById('empty-state'); if(emptyState && emptyState.style.opacity !== '0') { emptyState.style.opacity = '0'; setTimeout(() => emptyState.style.display = 'none', 400); } }

// Advanced Code Export
window.exportCode = async function(btn) {
    vibrate(); const pre = btn.parentElement.nextElementSibling; const code = pre.innerText;
    let fileName = `snippet_${Date.now()}.txt`;
    if(code.includes('function') && code.includes('end')) fileName = `script_${Date.now()}.lua`; // Luau auto-detect
    else if(code.includes('const') || code.includes('let')) fileName = `script_${Date.now()}.js`;
    
    if (window.Capacitor?.Plugins?.Filesystem) {
        try {
            await window.Capacitor.Plugins.Filesystem.writeFile({ path: fileName, data: code, directory: 'DOCUMENTS', encoding: 'utf8' });
            btn.textContent = "Saved to Docs!"; setTimeout(() => btn.textContent = "Export", 2000);
        } catch(e) { console.error(e); btn.textContent = "Error"; }
    } else {
        const blob = new Blob([code], { type: 'text/plain' }); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = fileName; a.click();
        btn.textContent = "Downloaded!"; setTimeout(() => btn.textContent = "Export", 2000);
    }
};

window.copyToClipboard = function(btn) {
    vibrate(); const pre = btn.parentElement.nextElementSibling; navigator.clipboard.writeText(pre.innerText).then(() => { btn.textContent = "Copied!"; setTimeout(() => btn.textContent = "Copy", 2000); });
};

window.parseMarkdown = function(text) {
    if (!text || typeof text !== "string") return "Error reading response.";
    let cleanedText = text.replace(/<think>[\s\S]*?(?:<\/think>|$)/gi, '').trim();
    if (!cleanedText) return "Processing...";
    let html = cleanedText.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const codeBlockRegex = /\x60\x60\x60([a-zA-Z0-9-]*)\n?([\s\S]*?)(?:\x60\x60\x60|$)/g;
    html = html.replace(codeBlockRegex, (match, language, snippet) => {
        const langLabel = language ? language.toUpperCase() : "CODE";
        return `<div class="mt-4 mb-4 rounded-xl overflow-hidden border border-[var(--border-color)]"><div class="bg-slate-800 text-slate-400 text-xs py-2 px-3 flex justify-between items-center font-semibold border-b border-slate-700"><span class="font-mono tracking-wider">${langLabel}</span><div class="flex gap-3"><button class="text-indigo-400 hover:text-indigo-300" onclick="window.exportCode(this)">Export</button><button class="text-indigo-400 hover:text-indigo-300" onclick="window.copyToClipboard(this)">Copy</button></div></div><pre class="p-4 overflow-x-auto text-sm font-mono" style="white-space: pre-wrap; word-break: break-word;"><code>${snippet.trim()}</code></pre></div>`;
    });
    html = html.replace(/\x60([^\x60\n]+)\x60/g, '<code style="background:rgba(99,102,241,0.1); border: 1px solid rgba(99,102,241,0.2); padding:2px 6px; border-radius:6px; color:#6366f1; font-family:monospace; font-size:0.9em;">$1</code>');
    html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>'); html = html.replace(/\*([^*]+)\*/g, '<em>$1</em>');
    html = html.replace(/^\s*[-*] (.*$)/gim, '<li class="ml-4 list-disc mb-1">$1</li>');
    html = html.replace(/(<li.*?>.*?<\/li>\n?)+/g, '<ul class="mb-4">$&</ul>');
    let blocks = html.split('\n\n'); for (let i = 0; i < blocks.length; i++) { if (!blocks[i].startsWith('<div') && !blocks[i].startsWith('<ul')) blocks[i] = `<p class="mb-3">${blocks[i].replace(/\n/g, '<br>')}</p>`; }
    return blocks.join('');
};

window.addBubble = function(text, kind, isTyping = false, isHTML = false) {
    hideEmptyState(); const chatInner = document.getElementById('chat-inner'); const chatArea = document.getElementById('chat-container');
    const wrapper = document.createElement('div'); wrapper.className = `message ${kind}`;
    if (kind === "bot") { wrapper.innerHTML = `<div class="avatar"><svg viewBox="0 0 32 32" fill="none"><path d="M16 2L3 10L16 18L29 10L16 2Z" fill="#38bdf8"/><path d="M3 10L16 30L16 18L3 10Z" fill="#2563eb"/><path d="M29 10L16 30L16 18L29 10Z" fill="#8b5cf6"/></svg></div>`; }
    const bubble = document.createElement('div'); bubble.className = "bubble";
    if (isTyping) { bubble.innerHTML = `<div class="typing-indicator"><span></span><span></span><span></span></div>`; } 
    else if (kind === "bot") { bubble.innerHTML = window.parseMarkdown(text); } 
    else { if (isHTML) { bubble.innerHTML = text; } else { bubble.textContent = text; } }
    wrapper.appendChild(bubble); chatInner.appendChild(wrapper);
    setTimeout(() => chatArea.scrollTo({ top: chatArea.scrollHeight, behavior: 'smooth' }), 50); return bubble;
};

window.submitMessage = async function(e) {
    if(e) e.preventDefault(); if(isProcessing) return;
    const input = document.getElementById('message'); const sendBtn = document.getElementById('sendBtn');
    const text = input.value.trim(); if(!text && !currentAttachment) return;
    
    vibrate(); isProcessing = true; input.value = ""; input.style.height = "auto"; sendBtn.disabled = true;
    
    let displayHtml = text;
    if(currentAttachment) {
        const safeText = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        displayHtml = `<img src="${currentAttachment}" class="max-w-full rounded-lg mb-2 object-contain max-h-48">` + (safeText ? `<br>${safeText}` : '');
    }
    
    window.addBubble(displayHtml, "user", false, !!currentAttachment); const loadingBubble = window.addBubble("", "bot", true);
    const payloadMessage = text || "Sent an image."; 
    
    // Inject Context based on toggles before sending
    let dynamicContext = "";
    if (isCopilot) dynamicContext += "SYSTEM INSTRUCTION: You are an expert game development copilot. Prioritize Luau syntax, strict optimization for mobile-friendly environments, and procedural logic mechanics. ";
    if (sysInstructions) dynamicContext += `USER CUSTOM INSTRUCTION: ${sysInstructions} `;
    
    let finalPayload = payloadMessage;
    if (dynamicContext !== "" && chatHistory.length === 0) finalPayload = dynamicContext + "\n\nUSER MESSAGE: " + payloadMessage;

    chatHistory.push({ role: "user", content: finalPayload });
    if (chatHistory.length > 20) chatHistory = chatHistory.slice(chatHistory.length - 20);

    const attachmentToSend = currentAttachment; window.removeAttachment();

    try {
        const response = await fetch(`${BACKEND_URL}/api/chat`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ message: finalPayload, messages: chatHistory, image: attachmentToSend }) });
        const responseText = await response.text(); let data = {};
        try { data = JSON.parse(responseText); } catch { throw new Error("Backend error."); }
        if (!response.ok) { chatHistory.pop(); throw new Error(data.reply || `Error ${response.status}`); }
        
        chatHistory.push({ role: "assistant", content: data.reply || "" });
        vibrate(); window.addBubble(data.reply || "Error generating response.", "bot");
        loadingBubble.parentElement.remove(); 
    } catch (err) {
        loadingBubble.innerHTML = `⚠️ Error: ${err.message}`; loadingBubble.className += " border border-red-500 text-red-500";
    } finally { isProcessing = false; sendBtn.disabled = false; input.focus(); }
};

const input = document.getElementById('message');
input.addEventListener('input', function() { this.style.height = "auto"; this.style.height = Math.min(this.scrollHeight, 120) + "px"; });
input.addEventListener('keydown', function(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); window.submitMessage(e); } });

// Firebase & Theme Initialization
if(auth) {
    auth.onAuthStateChanged((user) => {
        const ls = document.getElementById('login-screen');
        if (user) {
            ls.style.display = 'none'; document.getElementById('user-email').textContent = user.email || "User"; document.getElementById('user-initial').textContent = (user.email||"U").charAt(0).toUpperCase();
            if(window.Capacitor?.Plugins?.StatusBar) { window.Capacitor.Plugins.StatusBar.setBackgroundColor({color: isDarkMode ? '#0f172a' : '#ffffff'}); window.Capacitor.Plugins.StatusBar.setStyle({style: isDarkMode ? 'DARK' : 'LIGHT'}); }
        } else {
            ls.style.display = 'flex';
            if(window.Capacitor?.Plugins?.StatusBar) { window.Capacitor.Plugins.StatusBar.setBackgroundColor({color: '#000000'}); window.Capacitor.Plugins.StatusBar.setStyle({style: 'DARK'}); }
        }
    });
}
async function signInWithGoogle(btn) { if(!auth) return; btn.classList.add('btn-loading'); try { const googleUser = await window.Capacitor.Plugins.GoogleAuth.signIn(); const credential = firebase.auth.GoogleAuthProvider.credential(googleUser.authentication.idToken); await auth.signInWithCredential(credential); } catch (e) { document.getElementById('login-error').textContent = e.message; document.getElementById('login-error').classList.remove('hidden'); btn.classList.remove('btn-loading'); } }
function showEmailForm() { document.getElementById('auth-buttons').classList.add('hidden'); document.getElementById('email-form').style.display = 'flex'; }
function hideEmailForm() { document.getElementById('email-form').style.display = 'none'; document.getElementById('auth-buttons').classList.remove('hidden'); }
function signOutUser() { if(auth) auth.signOut(); document.body.classList.remove('sidebar-open'); chatHistory = []; }
