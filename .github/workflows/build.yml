name: Build Native Android APK
on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install Capacitor Dependencies
      run: |
        npm install

    - name: Initialize Android Platform
      run: |
        npx cap add android
        npx cap sync android

    - name: Set up Java JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Compile Unsigned Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Upload Finished APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Crystal-AI-Native-APK
        path: android/app/build/outputs/apk/release/app-release-unsigned.apk
        
