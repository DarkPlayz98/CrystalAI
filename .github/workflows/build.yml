name: Build Native Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and Sign Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps
          npm install -D @capacitor/assets --legacy-peer-deps
          
          # Patch capacitor-google-auth plugin to remove dead jcenter and use modern play-services-auth
          PLUGIN_GRADLE="node_modules/@codetrix-studio/capacitor-google-auth/android/build.gradle"
          if [ -f "$PLUGIN_GRADLE" ]; then
            sed -i 's/jcenter()/mavenCentral()/g' "$PLUGIN_GRADLE"
            sed -i "s/'com.google.android.gms:play-services-auth:18.+'/'com.google.android.gms:play-services-auth:21.3.0'/g" "$PLUGIN_GRADLE"
            sed -i "s/JavaVersion.VERSION_17/JavaVersion.VERSION_21/g" "$PLUGIN_GRADLE"
            sed -i "s/compileSdk .*/compileSdk project.hasProperty('compileSdkVersion') ? rootProject.ext.compileSdkVersion : 35/g" "$PLUGIN_GRADLE"
            sed -i "s/targetSdkVersion .*/targetSdkVersion project.hasProperty('targetSdkVersion') ? rootProject.ext.targetSdkVersion : 35/g" "$PLUGIN_GRADLE"
            sed -i "s/android.support.test.runner.AndroidJUnitRunner/androidx.test.runner.AndroidJUnitRunner/g" "$PLUGIN_GRADLE"
          fi

      - name: Build Web Assets
        run: |
          npm run build

      - name: Initialize Android Platform and Configure Google Services
        run: |
          rm -f capacitor.config.ts
          
          # 1. Decode Google Services JSON into temporary location (support both base64 and plaintext)
          TEMP_GS="/tmp/google-services.json"
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > "$TEMP_GS" 2>/dev/null || true
            if ! node -e "JSON.parse(require('fs').readFileSync('$TEMP_GS', 'utf8'))" >/dev/null 2>&1; then
              echo "${{ secrets.GOOGLE_SERVICES_JSON }}" > "$TEMP_GS"
            fi
            # Verify validity of JSON
            if ! node -e "JSON.parse(require('fs').readFileSync('$TEMP_GS', 'utf8'))" >/dev/null 2>&1; then
              echo "Warning: GOOGLE_SERVICES_JSON secret could not be parsed as valid JSON. Skipping."
              rm -f "$TEMP_GS"
            fi
          fi

          # 2. Extract actual package_name from google-services.json
          PKG_NAME=""
          if [ -f "$TEMP_GS" ]; then
            PKG_NAME=$(node -e "try { const d = JSON.parse(require('fs').readFileSync('$TEMP_GS', 'utf8')); const pkg = d.client?.[0]?.client_info?.android_client_info?.package_name; if (pkg) console.log(pkg); } catch(e){}")
          fi
          
          if [ -n "$PKG_NAME" ]; then
            echo "Detected package name from google-services.json: $PKG_NAME"
            node -e "const fs = require('fs'); const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8')); cfg.appId = '$PKG_NAME'; fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));"
          else
            echo "Using default appId from capacitor.config.json"
          fi

          # 3. Cleanly initialize or sync the Android platform
          if [ ! -f android/gradlew ]; then
            rm -rf android
            npx cap add android
          fi
          
          npx cap sync android
          npx @capacitor/assets generate --android 2>/dev/null || true

          # Guarantee valid, uncorrupted gradle-wrapper.jar is present
          mkdir -p android/gradle/wrapper
          if [ ! -f android/gradle/wrapper/gradle-wrapper.jar ] || ! unzip -t android/gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Repairing gradle-wrapper.jar from local node_modules plugin..."
            cp node_modules/@codetrix-studio/capacitor-google-auth/android/gradle/wrapper/gradle-wrapper.jar android/gradle/wrapper/gradle-wrapper.jar || true
          fi

          # 4. Copy google-services.json into android/app if valid
          if [ -f "$TEMP_GS" ]; then
            mkdir -p android/app
            cp "$TEMP_GS" android/app/google-services.json
          fi

          # 5. Ensure package IDs, namespaces, and MainActivity match
          if [ -n "$PKG_NAME" ]; then
            find android/ -name "build.gradle" -exec sed -i "s/applicationId [= ]*[\"'][^\"']*[\"']/applicationId \"$PKG_NAME\"/g" {} + 2>/dev/null || true
            find android/ -name "build.gradle" -exec sed -i "s/namespace [= ]*[\"'][^\"']*[\"']/namespace = \"$PKG_NAME\"/g" {} + 2>/dev/null || true
            
            # Synchronize strings.xml
            if [ -f "android/app/src/main/res/values/strings.xml" ]; then
              sed -i "s/<string name=\"package_name\">.*<\/string>/<string name=\"package_name\">$PKG_NAME<\/string>/g" android/app/src/main/res/values/strings.xml
              sed -i "s/<string name=\"custom_url_scheme\">.*<\/string>/<string name=\"custom_url_scheme\">$PKG_NAME<\/string>/g" android/app/src/main/res/values/strings.xml
            fi

            # Update package inside MainActivity.java and relocate file to new directory path
            PKG_PATH=$(echo "$PKG_NAME" | tr '.' '/')
            mkdir -p "android/app/src/main/java/$PKG_PATH"
            find android/app/src/main/java -name "MainActivity.java" -exec sed -i "s/package .*/package $PKG_NAME;/g" {} +
            MAIN_JAVA=$(find android/app/src/main/java -name "MainActivity.java" | head -n 1)
            if [ -n "$MAIN_JAVA" ] && [ "$MAIN_JAVA" != "android/app/src/main/java/$PKG_PATH/MainActivity.java" ]; then
              mv "$MAIN_JAVA" "android/app/src/main/java/$PKG_PATH/MainActivity.java"
            fi
          fi

          # 6. Ensure required Android permissions are in AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            for PERM in "android.permission.VIBRATE" "android.permission.ACCESS_NETWORK_STATE" "android.permission.RECORD_AUDIO" "android.permission.MODIFY_AUDIO_SETTINGS" "android.permission.ACCESS_COARSE_LOCATION" "android.permission.ACCESS_FINE_LOCATION"; do
              if ! grep -q "$PERM" "$MANIFEST"; then
                sed -i "/<\/manifest>/i \    <uses-permission android:name=\"$PERM\" />" "$MANIFEST"
              fi
            done
          fi

      - name: Inject Native Client ID
        run: |
          mkdir -p android/app/src/main/res/values
          cat <<EOF > android/app/src/main/res/values/google_auth_strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="server_client_id">390279102837-u12a9h0n65uo9orbaa4h3j0anvleses9.apps.googleusercontent.com</string>
          </resources>
          EOF

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 platforms;android-34 build-tools;34.0.0'

      - name: Accept Android SDK Licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || yes | sdkmanager --licenses 2>/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Ensure Valid Gradle Wrapper and Compile Release APK
        run: |
          cd android
          # Regenerate Gradle Wrapper using official Gradle toolchain
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin || true
          chmod +x gradlew
          
          # Test gradle-wrapper.jar validity
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ] && unzip -t "gradle/wrapper/gradle-wrapper.jar" >/dev/null 2>&1; then
            echo "Gradle wrapper verified successfully."
            ./gradlew assembleRelease -x lint -x lintVitalAnalyzeRelease -x lintVitalReportRelease --no-daemon --stacktrace
          else
            echo "Executing via Gradle toolchain directly..."
            gradle assembleRelease -x lint -x lintVitalAnalyzeRelease -x lintVitalReportRelease --no-daemon --stacktrace
          fi

      - name: Sign APK
        uses: r0adkll/sign-android-release@v1
        id: sign_app
        if: ${{ env.SIGNING_KEY != '' }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKeyBase64: ${{ secrets.SIGNING_KEY }}
          alias: ${{ secrets.ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare Release APK Artifact
        run: |
          if [ -n "${{ steps.sign_app.outputs.signedReleaseFile }}" ] && [ -f "${{ steps.sign_app.outputs.signedReleaseFile }}" ]; then
            cp "${{ steps.sign_app.outputs.signedReleaseFile }}" CrystalAI-release.apk
          else
            echo "Signing not performed or unsigned fallback used; copying standard release APK"
            find android/app/build/outputs/apk -name "*.apk" -exec cp {} CrystalAI-release.apk \; || true
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CrystalAI-APK
          path: CrystalAI-release.apk

      - name: Publish to Release Hub
        uses: ncipollo/release-action@v1
        if: ${{ env.RELEASE_HUB_TOKEN != '' }}
        env:
          RELEASE_HUB_TOKEN: ${{ secrets.RELEASE_HUB_TOKEN }}
        with:
          artifacts: "CrystalAI-release.apk"
          tag: "latest"
          name: "CrystalAI-release"
          body: "Tap the .apk file below to install directly."
          allowUpdates: true
          makeLatest: true
          owner: "DarkPlayz98" 
          repo: "Crystal-AI-Releases" 
          token: ${{ secrets.RELEASE_HUB_TOKEN }}

