name: Build Native Android APK

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22

    - name: Install Dependencies
      run: |
        npm install --legacy-peer-deps
        npm install -D @capacitor/assets --legacy-peer-deps
        npm install @codetrix-studio/capacitor-google-auth --legacy-peer-deps
        # Fixed: We can safely install @capgo/capacitor-navigation-bar now because 
        # we have set the Java JDK version below to 21. This prevents the transitive
        # dependency compilation error with bcprov-jdk18on-1.79.jar requiring JDK 21.
        npm install @capgo/capacitor-navigation-bar --legacy-peer-deps

    - name: Build Web Assets
      run: |
        npm run build

    - name: Initialize Android Platform and Configure Google Services
      run: |
        rm -f capacitor.config.ts
        
        # 1. Inject and decode Google Services JSON
        mkdir -p android/app
        echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 --decode > android/app/google-services.json

        # 2. Extract actual package_name from google-services.json
        PKG_NAME=$(node -e "try { const d = JSON.parse(require('fs').readFileSync('android/app/google-services.json', 'utf8')); const pkg = d.client?.[0]?.client_info?.android_client_info?.package_name; if (pkg) console.log(pkg); } catch(e){}")
        
        if [ -n "$PKG_NAME" ]; then
          echo "Detected package name from google-services.json: $PKG_NAME"
          # Update capacitor.config.json with the matching appId
          node -e "const fs = require('fs'); const cfg = JSON.parse(fs.readFileSync('capacitor.config.json', 'utf8')); cfg.appId = '$PKG_NAME'; fs.writeFileSync('capacitor.config.json', JSON.stringify(cfg, null, 2));"
        else
          echo "No package name found in google-services.json, using fallback com.crystal.app"
        fi

        # 3. Add & Sync Android platform with the exact package ID
        npx cap add android || npx cap sync android
        npx cap sync android
        npx @capacitor/assets generate --android

        # 4. Double check build.gradle and namespace in case platform was already cached
        if [ -n "$PKG_NAME" ]; then
          find android/ -name "build.gradle" -exec sed -i "s/applicationId \"com.crystal.app\"/applicationId \"$PKG_NAME\"/g" {} + 2>/dev/null || true
          find android/ -name "build.gradle" -exec sed -i "s/namespace \"com.crystal.app\"/namespace \"$PKG_NAME\"/g" {} + 2>/dev/null || true
        fi

    - name: Inject Native Client ID
      run: |
        cat <<EOF > android/app/src/main/res/values/google_auth_strings.xml
        <?xml version="1.0" encoding="utf-8"?>
        <resources>
            <string name="server_client_id">390279102837-u12a9h0n65uo9orbaa4h3j0anvleses9.apps.googleusercontent.com</string>
        </resources>
        EOF

    - name: Set up Java JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        # Fixed: Changed from 17 to 21 to resolve the Bouncy Castle (bcprov-jdk18on-1.79.jar) 
        # compilation error. Gradle 8.2+ and modern Capacitor 6+ are fully compatible 
        # with JDK 21, allowing compile-time plugins to build flawlessly.
        java-version: '21'

    - name: Compile Unsigned Release APK
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleRelease

    - name: Sign APK
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      env:
        BUILD_TOOLS_VERSION: "34.0.0"
      with:
        releaseDirectory: android/app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}

    - name: Rename APK to CrystalAI-release
      run: |
        mv ${{steps.sign_app.outputs.signedReleaseFile}} CrystalAI-release.apk

    - name: Publish to Release Hub
      uses: ncipollo/release-action@v1
      with:
        artifacts: "CrystalAI-release.apk"
        tag: "latest"
        name: "CrystalAI-release"
        body: "Tap the .apk file below to install directly."
        allowUpdates: true
        makeLatest: true
        owner: "DarkPlayz98" 
        repo: "Crystal-AI-Releases" 
        token: ${{ secrets.RELEASE_HUB_TOKEN }}
